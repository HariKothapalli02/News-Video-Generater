server {
    listen 80;
    server_name ytvideo.harikothapalli.space 3.25.196.104 _;

    client_max_body_size 150M;

    # Serve React Frontend Build
    location / {
        root /home/ubuntu/bytewire/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Node Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket Proxy for Real-Time Generation Updates
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Video & Thumbnail File Streaming
    location /videos/ {
        alias /home/ubuntu/bytewire/videos/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
    }

    location /thumbnails/ {
        alias /home/ubuntu/bytewire/thumbnails/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }
}

