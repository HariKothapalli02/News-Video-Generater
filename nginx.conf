server {
    listen 80;
    server_name localhost;

    # Max upload size for video uploads if any (optional but good practice)
    client_max_body_size 100M;

    # Route requests to frontend static built files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Route REST API requests to backend
    location /api {
        proxy_pass http://backend:5000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route Socket.io websocket upgrade requests to backend
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route requests to static generated videos
    location /videos/ {
        proxy_pass http://backend:5000/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Route requests to static generated thumbnails
    location /thumbnails/ {
        proxy_pass http://backend:5000/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
